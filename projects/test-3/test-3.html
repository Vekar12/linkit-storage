<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkIt Demo Page</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    margin: 0;
    padding: 0;
}

header {
    background: #2F6FED;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 800px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

button {
    background: #2F6FED;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #1f55c5;
}

.result {
    margin-top: 20px;
    padding: 15px;
    background: #eef3ff;
    border-radius: 6px;
    display: none;
}
</style>

</head>

<body>

<header>
<h1>LinkIt Demo</h1>
<p>This is a sample HTML file hosted via LinkIt</p>
</header>

<div class="container">

<h2>Loan Approval Simulator</h2>

<p>Click the button below to simulate a loan approval workflow.</p>

<button onclick="approveLoan()">Run Simulation</button>

<div class="result" id="resultBox">
<h3>Loan Approved ✅</h3>
<p>Amount: ₹5,00,000</p>
<p>Status: Disbursement Initiated</p>
</div>

</div>

<script>
function approveLoan(){
    document.getElementById("resultBox").style.display = "block";
}
</script>

</body>
</html>
