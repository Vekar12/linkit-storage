<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iLens Disbursement Dashboard</title>

<style>
body { margin:0; font-family:"Segoe UI"; background:#f4f6f9; }

/* TOP */
.topbar {
  background:#a3211f; color:#fff; padding:10px 20px;
  display:flex; justify-content:space-between;
}
.subbar { background:#c0392b; color:#fff; padding:8px 20px; }

/* LAYOUT */
.container { display:flex; }
.sidebar {
  width:220px; background:#fff; border-right:1px solid #ddd;
}
.sidebar div { padding:12px; cursor:pointer; }
.sidebar .active { background:#1f3a5f; color:#fff; }

.main { flex:1; padding:15px; }

/* HEADER */
.header {
  background:#fff; padding:12px; border-radius:6px;
  display:flex; justify-content:space-between;
}

/* STAGE TRACKER */
.stage-bar {
  background:#fff; padding:10px; margin-top:10px;
  border-radius:6px;
}
.stage-container {
  display:flex; font-size:12px;
}
.stage {
  flex:1; text-align:center; padding:5px;
  border-right:1px solid #ddd;
}
.stage.active { background:#2e7d32; color:#fff; }

/* STATUS STRIP */
.strip {
  margin-top:10px;
}
.badge {
  padding:5px 10px; border-radius:5px; color:#fff;
  font-size:12px;
}
.green { background:#2e7d32; }
.yellow { background:#fbc02d; color:#000; }
.red { background:#e53935; }
.orange { background:#f57c00; }

/* TABLE */
.panel {
  background:#fff; margin-top:10px; border-radius:6px;
}
.panel-header {
  background:#1f3a5f; color:#fff; padding:10px;
}
table { width:100%; border-collapse:collapse; }
th,td {
  padding:10px; border-bottom:1px solid #eee;
  font-size:13px;
}
th { background:#f0f3f7; }

/* BUTTON */
button {
  padding:5px 8px; border:none; border-radius:4px;
  cursor:pointer; font-size:12px;
}
.blue { background:#1976d2; color:#fff; }
.greenBtn { background:#2e7d32; color:#fff; }
.orangeBtn { background:#f57c00; color:#fff; }

/* TIMELINE */
.timeline {
  background:#fff; padding:10px; margin-top:10px;
  border-radius:6px; font-size:12px;
}
</style>

</head>

<body>

<div class="topbar">
  <div>iLens Mortgage</div>
  <div>Maharshi Divekar</div>
</div>

<div class="subbar">Disbursement Module</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="active">Common Dashboard</div>
  <div>Sales Workspace</div>
  <div>Credit Workspace</div>
</div>

<!-- MAIN -->
<div class="main">

<!-- HEADER -->
<div class="header">
  <div><b>NARENDRA VERMA</b> | ₹17L</div>
  <div>Status: <span style="color:orange">In Progress</span></div>
</div>

<!-- STAGE TRACKER -->
<div class="stage-bar">
  <div class="stage-container" id="stageBar"></div>
</div>

<!-- STATUS STRIP -->
<div class="strip">
  <span class="badge green" id="legalStatus">Legal: Completed</span>
  <span class="badge green" id="techStatus">Technical: Completed</span>
</div>

<!-- TABLE -->
<div class="panel">
<div class="panel-header">Documents & Tasks</div>

<table>
<thead>
<tr>
<th>Document</th>
<th>Status</th>
<th>Verification</th>
<th>Action Pending At</th>
<th>Action</th>
<th>Dependency</th>
</tr>
</thead>

<tbody id="taskTable"></tbody>

</table>

<div style="padding:10px;text-align:right;">
  <button class="greenBtn" onclick="submit()">Submit</button>
</div>

</div>

<!-- TIMELINE -->
<div class="timeline" id="timeline"></div>

</div>
</div>

<script>

/* ===== STAGES ===== */
let stages = ["Login","Underwriting","Sanction","File Login","Post Legal","DM","RCU","Disbursed"];

/* ===== TASKS ===== */
let tasks = [
 {name:"Agreement to Sale", status:"pending", verify:"-", role:"Sales", dep:"Independent"},
 {name:"Property Tax", status:"uploaded", verify:"Pending", role:"Credit", dep:"Soft"},
 {name:"Builder NOC", status:"query", verify:"Pending", role:"Customer", dep:"Hard"},
 {name:"Salary Slips", status:"uploaded", verify:"Verified", role:"Credit", dep:"Independent"},
 {name:"Bank Statement", status:"uploaded", verify:"Pending", role:"Credit", dep:"Soft"}
];

let timeline=[];

/* ===== RENDER ===== */
function render(){

 /* STAGE BAR */
 let html="";
 stages.forEach((s,i)=>{
   let active = i < progressStage() ? "active":"";
   html+=`<div class="stage ${active}">${s}</div>`;
 });
 document.getElementById("stageBar").innerHTML=html;

 /* TABLE */
 let table="";
 tasks.forEach((t,i)=>{

   let statusClass = t.status=="uploaded"?"green":t.status=="pending"?"yellow":t.status=="query"?"red":"orange";

   let disabled = t.dep=="Hard" && t.status!="uploaded" ? "disabled":"";

   table+=`
   <tr>
     <td>${t.name}</td>
     <td><span class="badge ${statusClass}">${t.status}</span></td>
     <td>${t.verify}</td>
     <td>${t.role}</td>
     <td>
       <button class="blue" onclick="upload(${i})" ${disabled}>Upload</button>
       <button class="greenBtn" onclick="verify(${i})">Verify</button>
       <button class="orangeBtn" onclick="query(${i})">Query</button>
     </td>
     <td>${t.dep}</td>
   </tr>`;
 });

 document.getElementById("taskTable").innerHTML=table;

 renderTimeline();
}

/* ===== ACTIONS ===== */
function upload(i){
 tasks[i].status="uploaded";
 log(tasks[i].name+" uploaded");
 render();
}

function verify(i){
 tasks[i].verify="Verified";
 log(tasks[i].name+" verified");
 render();
}

function query(i){
 tasks[i].status="query";
 log(tasks[i].name+" query raised");
 render();
}

/* ===== PROGRESS ===== */
function progressStage(){
 let done = tasks.filter(t=>t.verify=="Verified").length;
 return Math.floor((done/tasks.length)*stages.length);
}

/* ===== TIMELINE ===== */
function log(msg){
 timeline.unshift(new Date().toLocaleTimeString()+" - "+msg);
}

function renderTimeline(){
 let html="<b>Recent Activity</b><br>";
 timeline.slice(0,6).forEach(t=> html+=`<div>${t}</div>`);
 document.getElementById("timeline").innerHTML=html;
}

/* ===== SUBMIT ===== */
function submit(){
 alert("Submitted successfully (partial allowed)");
}

/* INIT */
render();

</script>

</body>
</html>
