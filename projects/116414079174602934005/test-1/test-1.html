<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>iLens Disbursement</title>

<style>
body {
  margin:0;
  font-family: "Segoe UI", Arial;
  background:#f4f6f9;
}

/* ===== TOP NAV ===== */
.topbar {
  background:#a3211f;
  color:#fff;
  padding:10px 20px;
  display:flex;
  justify-content:space-between;
  font-weight:600;
}

.subnav {
  background:#b8322b;
  color:#fff;
  padding:8px 20px;
  font-size:14px;
}

/* ===== LAYOUT ===== */
.container { display:flex; }

.sidebar {
  width:230px;
  background:#fff;
  border-right:1px solid #ddd;
}

.sidebar div {
  padding:12px 15px;
  cursor:pointer;
  font-size:14px;
}

.sidebar .active {
  background:#1f3a5f;
  color:#fff;
  font-weight:600;
}

.main {
  flex:1;
  padding:15px;
}

/* ===== HEADER ===== */
.header {
  background:#fff;
  padding:12px;
  border-radius:6px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  font-size:14px;
}

/* ===== PROGRESS ===== */
.progress-box {
  background:#fff;
  padding:15px;
  border-radius:6px;
}

.progress-bar {
  height:14px;
  background:#ddd;
  border-radius:10px;
  overflow:hidden;
  margin-top:8px;
}

.progress-fill {
  height:100%;
  background:#2e7d32;
}

/* ===== CARDS ===== */
.cards {
  display:flex;
  gap:12px;
  margin-top:12px;
}

.card {
  flex:1;
  background:#fff;
  padding:15px;
  border-radius:6px;
  text-align:center;
  cursor:pointer;
}

.card:hover { background:#eef4ff; }

.card-title {
  font-weight:600;
}

.card-count {
  font-size:18px;
  margin-top:5px;
}

.card-sub {
  font-size:12px;
  color:#777;
}

/* ===== PANEL ===== */
.panel {
  margin-top:12px;
  background:#fff;
  border-radius:6px;
  display:none;
}

.panel-header {
  background:#1f3a5f;
  color:#fff;
  padding:10px;
  font-weight:600;
}

/* ===== TABLE ===== */
table {
  width:100%;
  border-collapse:collapse;
}

th, td {
  padding:10px;
  border-bottom:1px solid #eee;
  font-size:13px;
}

th { background:#f0f3f7; }

/* ===== STATUS ===== */
.badge {
  padding:4px 8px;
  border-radius:5px;
  color:white;
  font-size:11px;
}

.pending { background:#e53935; }
.received { background:#2e7d32; }
.query { background:#f57c00; }
.verified { background:#2e7d32; }

/* ===== BUTTONS ===== */
button {
  padding:5px 8px;
  border:none;
  border-radius:4px;
  cursor:pointer;
  font-size:12px;
}

.blue { background:#1976d2; color:white; }
.green { background:#2e7d32; color:white; }
.orange { background:#f57c00; color:white; }

.footer {
  padding:10px;
  text-align:right;
}
</style>
</head>

<body>

<div class="topbar">
  iLens Mortgage
  <div>Maharshi Divekar</div>
</div>

<div class="subnav">Disbursement Module</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="active" onclick="switchScreen('summary')">Disbursement Summary</div>
  <div onclick="switchScreen('dashboard')">Application Dashboard</div>
</div>

<!-- MAIN -->
<div class="main">

<!-- HEADER -->
<div class="header">
  <div><b>NARENDRA VERMA</b> | ₹17L | Home Loan</div>
  <div>Status: <span style="color:orange">In Progress</span></div>
</div>

<!-- SUMMARY -->
<div id="summary">

<div class="progress-box">
  Overall Progress
  <div class="progress-bar">
    <div id="progressFill" class="progress-fill"></div>
  </div>
</div>

<div class="cards" id="summaryCards"></div>

</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">

<div class="cards" id="dashboardCards"></div>

<div class="panel" id="panel">
  <div class="panel-header" id="panelTitle"></div>

  <table>
    <thead>
      <tr>
        <th>Task</th>
        <th>Status</th>
        <th>Dependency</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="taskTable"></tbody>
  </table>

  <div class="footer">
    <button class="green">Submit Completed</button>
  </div>

</div>

</div>

</div>
</div>

<script>

/* ===== CENTRAL STATE ===== */
let tasks = [
 {name:"Agreement to Sale", role:"sales", status:"pending", dep:"Independent"},
 {name:"Property Tax Receipt", role:"sales", status:"received", dep:"Independent"},
 {name:"Builder NOC", role:"sales", status:"query", dep:"Customer"},
 {name:"Salary Slips", role:"credit", status:"verified", dep:"Customer"},
 {name:"PAN Upload", role:"customer", status:"pending", dep:"Independent"}
];

let roles = ["customer","sales","credit","rcu"];
let currentRole = "sales";

/* ===== SCREEN SWITCH ===== */
function switchScreen(screen){
  document.getElementById("summary").style.display="none";
  document.getElementById("dashboard").style.display="none";

  document.getElementById(screen).style.display="block";
  renderAll();
}

/* ===== RENDER ===== */
function renderAll(){
  renderSummary();
  renderDashboard();
  renderTasks();
  updateProgress();
}

/* ===== SUMMARY ===== */
function renderSummary(){
  let html="";

  roles.forEach(r=>{
    const roleTasks = tasks.filter(t=>t.role===r);
    const done = roleTasks.filter(t=>t.status==="verified").length;
    const total = roleTasks.length;

    html += `
      <div class="card">
        <div class="card-title">${r.toUpperCase()}</div>
        <div class="card-count">${done}/${total}</div>
        <div class="card-sub">${done===total ? "Complete" : "In Progress"}</div>
      </div>
    `;
  });

  document.getElementById("summaryCards").innerHTML = html;
}

/* ===== DASHBOARD ===== */
function renderDashboard(){
  let html="";

  roles.forEach(r=>{
    const pending = tasks.filter(t=>t.role===r && t.status!=="verified").length;

    html += `
      <div class="card" onclick="openPanel('${r}')">
        <div class="card-title">${r.toUpperCase()}</div>
        <div class="card-count">${pending}</div>
      </div>
    `;
  });

  document.getElementById("dashboardCards").innerHTML = html;
}

/* ===== PANEL ===== */
function openPanel(role){
  currentRole = role;
  document.getElementById("panel").style.display="block";
  document.getElementById("panelTitle").innerText = role.toUpperCase()+" TASKS";
  renderTasks();
}

/* ===== TASK TABLE ===== */
function renderTasks(){
  const table = document.getElementById("taskTable");
  table.innerHTML="";

  tasks.filter(t=>t.role===currentRole).forEach((t,i)=>{
    table.innerHTML += `
      <tr>
        <td>${t.name}</td>
        <td><span class="badge ${t.status}">${t.status}</span></td>
        <td>${t.dep}</td>
        <td>
          <button class="blue" onclick="update(${i},'received')">Receive</button>
          <button class="green" onclick="update(${i},'verified')">Verify</button>
          <button class="orange" onclick="update(${i},'query')">Query</button>
        </td>
      </tr>
    `;
  });
}

/* ===== UPDATE ===== */
function update(index,status){
  const roleTasks = tasks.filter(t=>t.role===currentRole);
  const actualTask = roleTasks[index];

  actualTask.status = status;
  renderAll();
}

/* ===== PROGRESS ===== */
function updateProgress(){
  const total = tasks.length;
  const done = tasks.filter(t=>t.status==="verified").length;
  document.getElementById("progressFill").style.width = ((done/total)*100)+"%";
}

renderAll();

</script>

</body>
</html>
