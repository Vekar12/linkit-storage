<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iLens Disbursement Demo</title>

<style>
body { margin:0; font-family:"Segoe UI"; background:#f4f6f9; }

/* TOP */
.topbar { background:#a3211f; color:#fff; padding:10px 20px; display:flex; justify-content:space-between; }
.subbar { background:#c0392b; color:#fff; padding:8px 20px; }

/* LAYOUT */
.container { display:flex; }
.sidebar { width:220px; background:#fff; border-right:1px solid #ddd; }
.sidebar div { padding:12px; }
.main { flex:1; padding:15px; }

/* HEADER */
.header { background:#fff; padding:12px; border-radius:6px; display:flex; justify-content:space-between; }

/* ROLE STRIP */
.role-strip {
  margin-top:10px; padding:10px; border-radius:6px;
  background:#fff; font-weight:600;
}

/* TABLE */
.panel { margin-top:10px; background:#fff; border-radius:6px; }
.panel-header { background:#1f3a5f; color:#fff; padding:10px; }

table { width:100%; border-collapse:collapse; }
th,td { padding:10px; border-bottom:1px solid #eee; font-size:13px; }
th { background:#f0f3f7; }

/* BADGE */
.badge { padding:4px 8px; border-radius:5px; color:#fff; font-size:11px; }
.green { background:#2e7d32; }
.yellow { background:#fbc02d; color:#000; }
.red { background:#e53935; }

/* BUTTON */
button { padding:5px 8px; border:none; border-radius:4px; cursor:pointer; font-size:12px; }
.blue { background:#1976d2; color:#fff; }
.greenBtn { background:#2e7d32; color:#fff; }
.gray { background:#ccc; cursor:not-allowed; }

/* LOCKED */
.locked { opacity:0.4; pointer-events:none; }

</style>
</head>

<body>

<div class="topbar">
  <div>iLens Mortgage</div>
  <div>Demo User</div>
</div>

<div class="subbar">Disbursement Demo Flow</div>

<div class="container">

<div class="sidebar">
  <div>Common Dashboard</div>
</div>

<div class="main">

<div class="header">
  <div><b>NARENDRA VERMA</b> | ₹17L</div>
  <div>Status: Demo Flow</div>
</div>

<div class="role-strip" id="roleStrip"></div>

<div class="panel">
<div class="panel-header">Documents Dashboard</div>

<table>
<thead>
<tr>
<th>Document</th>
<th>Status</th>
<th>Owner</th>
<th>Action</th>
</tr>
</thead>

<tbody id="table"></tbody>
</table>

<div style="padding:10px;text-align:right;">
  <button class="greenBtn" onclick="submit()">Submit</button>
</div>

</div>

</div>
</div>

<script>

/* ===== DEMO FLOW ===== */
let currentRole = "Customer";

let flowOrder = ["Customer","Sales","Credit"];

/* ===== TASKS ===== */
let tasks = [
 {name:"PAN Upload", owner:"Customer", status:"pending"},
 {name:"Income Proof", owner:"Customer", status:"pending"},
 {name:"Agreement Collection", owner:"Sales", status:"pending"},
 {name:"Property Check", owner:"Sales", status:"pending"},
 {name:"Income Verification", owner:"Credit", status:"pending"}
];

/* ===== RENDER ===== */
function render(){

 document.getElementById("roleStrip").innerText =
 "Current Stage: " + currentRole;

 let html="";

 tasks.forEach((t,i)=>{

 let locked = t.owner !== currentRole ? "locked":"";

 html+=`
 <tr class="${locked}">
  <td>${t.name}</td>
  <td><span class="badge ${t.status==="pending"?"yellow":"green"}">${t.status}</span></td>
  <td>${t.owner}</td>
  <td>
    ${t.owner===currentRole ? `<button class="blue" onclick="complete(${i})">Complete</button>` : `<button class="gray">Locked</button>`}
  </td>
 </tr>`;
 });

 document.getElementById("table").innerHTML=html;
}

/* ===== COMPLETE ===== */
function complete(i){
 tasks[i].status="done";
 render();
}

/* ===== SUBMIT ===== */
function submit(){

 let pending = tasks.filter(t => t.owner===currentRole && t.status!=="done");

 if(pending.length>0){
   alert("Complete all tasks first");
   return;
 }

 let nextIndex = flowOrder.indexOf(currentRole) + 1;

 if(nextIndex < flowOrder.length){
   currentRole = flowOrder[nextIndex];
   alert("Moved to "+currentRole+" stage");
 } else {
   alert("Disbursement Ready ✅");
 }

 render();
}

render();

</script>

</body>
</html>
