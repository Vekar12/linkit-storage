<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iLens Disbursement OS</title>

<style>
body { margin:0; font-family:"Segoe UI"; background:#f4f6f9; }

/* ===== TOP ===== */
.topbar {
  background:#a3211f; color:#fff;
  padding:10px 20px;
  display:flex; justify-content:space-between;
  font-weight:600;
}
.subbar { background:#c0392b; color:#fff; padding:8px 20px; }

/* ===== LAYOUT ===== */
.container { display:flex; }
.sidebar {
  width:240px; background:#fff; border-right:1px solid #ddd;
}
.sidebar div { padding:12px; cursor:pointer; }
.sidebar .active { background:#1f3a5f; color:#fff; }

.main { flex:1; padding:15px; }

/* ===== HEADER ===== */
.header {
  background:#fff; padding:12px;
  border-radius:6px;
  display:flex; justify-content:space-between;
}

/* ===== INSIGHT ===== */
.insight {
  margin-top:10px; padding:10px;
  border-radius:6px; font-size:13px;
}
.red-bg { background:#fdecea; color:#c62828; }
.green-bg { background:#e8f5e9; color:#2e7d32; }
.orange-bg { background:#fff3e0; color:#ef6c00; }

/* ===== ACTION STRIP ===== */
.action-strip {
  background:#fff; padding:10px; margin-top:10px;
  border-radius:6px; font-size:14px;
  display:flex; justify-content:space-between;
}

/* ===== TABLE ===== */
.panel {
  margin-top:10px; background:#fff;
  border-radius:6px;
}
.panel-header {
  background:#1f3a5f; color:#fff;
  padding:10px; font-weight:600;
}

table {
  width:100%;
  border-collapse:collapse;
}
th, td {
  padding:10px;
  border-bottom:1px solid #eee;
  font-size:13px;
  text-align:left;
}
th { background:#f0f3f7; }

/* ===== BADGES ===== */
.badge {
  padding:4px 8px;
  border-radius:5px;
  font-size:11px;
  color:#fff;
}
.green { background:#2e7d32; }
.yellow { background:#fbc02d; color:#000; }
.red { background:#e53935; }
.orange { background:#f57c00; }

/* ===== BUTTON ===== */
button {
  padding:5px 8px;
  border:none;
  border-radius:4px;
  cursor:pointer;
  font-size:12px;
}
.blue { background:#1976d2; color:#fff; }
.greenBtn { background:#2e7d32; color:#fff; }
.orangeBtn { background:#f57c00; color:#fff; }
.gray { background:#ccc; cursor:not-allowed; }

/* ===== PRIORITY ===== */
.p1 { color:#c62828; font-weight:bold; }
.p2 { color:#f57c00; }
.p3 { color:#555; }

/* ===== SLA ===== */
.sla-ok { color:#2e7d32; }
.sla-warn { color:#f57c00; }
.sla-breach { color:#c62828; font-weight:bold; }

/* ===== TIMELINE ===== */
.timeline {
  background:#fff;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  font-size:12px;
}

</style>
</head>

<body>

<div class="topbar">
  <div>iLens Mortgage</div>
  <div>User</div>
</div>

<div class="subbar">Disbursement Intelligence Dashboard</div>

<div class="container">

<div class="sidebar">
  <div class="active">Common Dashboard</div>
  <div>Role View</div>
  <div>Sales Workspace</div>
</div>

<div class="main">

<div class="header">
  <div><b>NARENDRA VERMA</b> | ₹17L</div>
  <div>Status: <span style="color:orange">In Progress</span></div>
</div>

<!-- CRITICAL INSIGHT -->
<div id="critical" class="insight"></div>

<!-- NEXT ACTION -->
<div id="nextAction" class="action-strip"></div>

<!-- TABLE -->
<div class="panel">
<div class="panel-header">Master Task Engine</div>

<table>
<thead>
<tr>
<th><input type="checkbox" onclick="selectAll(this)"></th>
<th>Document</th>
<th>Status</th>
<th>Verification</th>
<th>Owner</th>
<th>Dependency</th>
<th>SLA</th>
<th>Priority</th>
<th>Action</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

<div style="padding:10px;text-align:right;">
  <button class="greenBtn" onclick="bulkSubmit()">Submit Selected</button>
</div>

</div>

<div class="timeline" id="timeline"></div>

</div>
</div>

<script>

/* ===== DATA ===== */
let tasks = [
 {name:"Builder NOC", status:"pending", verify:"-", owner:"Customer", dep:"Hard", sla:1, priority:"P1"},
 {name:"Agreement", status:"uploaded", verify:"Pending", owner:"Credit", dep:"Soft", sla:3, priority:"P2"},
 {name:"Salary Slips", status:"uploaded", verify:"Verified", owner:"Credit", dep:"Independent", sla:0, priority:"P3"}
];

let timeline = [];

/* ===== RENDER ===== */
function render(){
 renderTable();
 renderInsight();
 renderNextAction();
 renderTimeline();
}

/* ===== TABLE ===== */
function renderTable(){
 let html="";

 tasks.forEach((t,i)=>{

 let depIcon = t.dep==="Hard"?"🔒":t.dep==="Soft"?"⚠":"";

 let slaClass = t.sla<=0?"sla-ok":t.sla<2?"sla-breach":"sla-warn";

 let disabled = t.dep==="Hard" && t.status!=="uploaded";

 html+=`
 <tr>
  <td><input type="checkbox" class="chk"></td>
  <td>${t.name}</td>
  <td><span class="badge ${t.status==="uploaded"?"green":t.status==="pending"?"yellow":"red"}">${t.status}</span></td>
  <td>${t.verify}</td>
  <td>${t.owner}</td>
  <td>${depIcon} ${t.dep}</td>
  <td class="${slaClass}">${t.sla}h</td>
  <td class="${t.priority.toLowerCase()}">${t.priority}</td>
  <td>
    ${disabled ? '<button class="gray">Locked</button>' : getActions(i)}
  </td>
 </tr>`;
 });

 document.getElementById("table").innerHTML=html;
}

/* ===== ACTION ENGINE ===== */
function getActions(i){
 let t = tasks[i];

 if(t.owner==="Customer") return `<button class="blue" onclick="upload(${i})">Upload</button>`;
 if(t.owner==="Credit") return `<button class="greenBtn" onclick="verify(${i})">Verify</button>
                                 <button class="orangeBtn" onclick="query(${i})">Query</button>`;
 return `<button class="blue" onclick="receive(${i})">Receive</button>`;
}

/* ===== ACTIONS ===== */
function upload(i){
 tasks[i].status="uploaded";
 cascade(i);
 log("Uploaded "+tasks[i].name);
 render();
}

function verify(i){
 tasks[i].verify="Verified";
 log("Verified "+tasks[i].name);
 render();
}

function query(i){
 tasks[i].status="query";
 log("Query "+tasks[i].name);
 render();
}

function receive(i){
 tasks[i].status="uploaded";
 cascade(i);
 log("Received "+tasks[i].name);
 render();
}

/* ===== CASCADE ===== */
function cascade(i){
 tasks.forEach(t=>{
   if(t.dep==="Hard" && t.status==="pending"){
     t.dep="Soft"; // unlock
   }
 });
}

/* ===== INSIGHT ===== */
function renderInsight(){
 let blocker = tasks.find(t=>t.dep==="Hard" && t.status!=="uploaded");

 if(blocker){
   document.getElementById("critical").className="insight red-bg";
   document.getElementById("critical").innerText =
   "BLOCKED: "+blocker.name+" pending with "+blocker.owner;
 } else {
   document.getElementById("critical").className="insight green-bg";
   document.getElementById("critical").innerText = "No blockers";
 }
}

/* ===== NEXT ACTION ===== */
function renderNextAction(){
 let next = tasks.find(t=>t.status==="pending");

 if(next){
   document.getElementById("nextAction").innerText =
   "Next Action: "+next.owner+" to complete "+next.name;
 }
}

/* ===== BULK ===== */
function bulkSubmit(){
 alert("Bulk submitted");
}

/* ===== TIMELINE ===== */
function log(msg){
 timeline.unshift(new Date().toLocaleTimeString()+" | "+msg);
}

function renderTimeline(){
 let html="<b>Recent Activity</b><br>";
 timeline.slice(0,5).forEach(t=> html+=`<div>${t}</div>`);
 document.getElementById("timeline").innerHTML=html;
}

render();

</script>

</body>
</html>
