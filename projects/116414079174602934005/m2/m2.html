<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iLens Disbursement OS</title>

<style>
body { margin:0; font-family:"Segoe UI"; background:#f4f6f9; }

/* HEADER */
.topbar { background:#a3211f; color:#fff; padding:10px 20px; display:flex; justify-content:space-between; }
.subbar { background:#c0392b; color:#fff; padding:8px 20px; }

.container { display:flex; }
.sidebar { width:220px; background:#fff; border-right:1px solid #ddd; }
.main { flex:1; padding:15px; }

.header {
  background:#fff; padding:12px;
  display:flex; justify-content:space-between;
  border-radius:6px;
}

/* ROLE */
.role-banner {
  margin-top:10px;
  padding:10px;
  background:#1f3a5f;
  color:#fff;
  border-radius:6px;
  font-weight:600;
}

/* STRIPS */
.strip { margin-top:10px; padding:10px; border-radius:6px; }
.green { background:#e8f5e9; color:#2e7d32; }
.red { background:#fdecea; color:#c62828; }
.orange { background:#fff3e0; color:#ef6c00; }

/* TRACKER */
.tracker { background:#fff; margin-top:10px; padding:10px; border-radius:6px; }
.stage-bar { display:flex; }
.stage { flex:1; text-align:center; padding:6px; border-right:1px solid #ddd; }
.stage.active { background:#2e7d32; color:#fff; }

/* TABLE */
.panel { background:#fff; margin-top:10px; border-radius:6px; }
.panel-header { background:#1f3a5f; color:#fff; padding:10px; }

table { width:100%; border-collapse:collapse; table-layout:fixed; }
th,td { padding:10px; border-bottom:1px solid #eee; font-size:13px; }
th { background:#f0f3f7; text-align:left; }

th:nth-child(1){width:18%;}
th:nth-child(2){width:12%;}
th:nth-child(3){width:12%;}
th:nth-child(4){width:18%;}
th:nth-child(5){width:10%;}
th:nth-child(6){width:30%;}

/* BADGE */
.badge { padding:4px 8px; border-radius:5px; font-size:11px; color:#fff; }
.pending { background:#fbc02d; color:#000; }
.progress { background:#f57c00; }
.submitted { background:#1976d2; }
.verified { background:#2e7d32; }
.query { background:#e53935; }

/* BUTTON */
button {
  padding:5px 7px;
  border:none;
  border-radius:4px;
  cursor:pointer;
  font-size:11px;
  margin:2px;
}
.blue { background:#1976d2; color:#fff; }
.greenBtn { background:#2e7d32; color:#fff; }
.orangeBtn { background:#f57c00; color:#fff; }
.gray { background:#ccc; cursor:not-allowed; }

.locked { opacity:0.4; pointer-events:none; }

.doc-icon { font-size:16px; }

.timeline { background:#fff; padding:10px; margin-top:10px; border-radius:6px; font-size:12px; }

</style>
</head>

<body>

<div class="topbar">
  <div>iLens Mortgage</div>
  <div>Demo Mode</div>
</div>

<div class="subbar">Disbursement OS</div>

<div class="container">

<div class="sidebar">
  <div>Documents Dashboard</div>
</div>

<div class="main">

<div class="header">
  <div><b>NARENDRA VERMA</b></div>
  <div>Status: In Progress</div>
</div>

<div class="role-banner" id="roleBanner"></div>

<div class="strip green" id="completionBar"></div>

<div class="tracker">
  <div class="stage-bar" id="tracker"></div>
</div>

<div id="blocker" class="strip"></div>
<div id="nextAction" class="strip"></div>

<div class="panel">
<div class="panel-header">Documents Dashboard</div>

<table>
<thead>
<tr>
<th>Document</th>
<th>Status</th>
<th>Verification</th>
<th>Action Pending At</th>
<th>Docs</th>
<th>Action</th>
</tr>
</thead>

<tbody id="table"></tbody>
</table>

<div style="padding:10px;text-align:right;">
<button class="greenBtn" onclick="submit()">Submit</button>
</div>

</div>

<div class="timeline" id="timeline"></div>

</div>
</div>

<script>

let roles=["Customer","Sales","Credit"];
let stage=0;

let tasks=[
 {name:"PAN", owner:"Customer", verifier:"Credit", status:"Pending", doc:false},
 {name:"Aadhaar", owner:"Customer", verifier:"Credit", status:"Pending", doc:false},
 {name:"Salary Slips", owner:"Customer", verifier:"Credit", status:"Pending", doc:false},
 {name:"Bank Statement", owner:"Customer", verifier:"Credit", status:"Pending", doc:false},
 {name:"Agreement", owner:"Sales", verifier:"Credit", status:"Pending", doc:false},
 {name:"Property Docs", owner:"Sales", verifier:"Credit", status:"Pending", doc:false},
 {name:"Credit Assessment", owner:"Credit", verifier:"Credit", status:"Pending", doc:false},
 {name:"Final Approval", owner:"Credit", verifier:"Credit", status:"Pending", doc:false}
];

let timeline=[];

function render(){

 let role=roles[stage];
 document.getElementById("roleBanner").innerText="Logged in as: "+role;

 let t="";
 roles.forEach((r,i)=> t+=`<div class="stage ${i<=stage?'active':''}">${r}</div>`);
 document.getElementById("tracker").innerHTML=t;

 let total=tasks.length;
 let done=tasks.filter(t=>t.status==="Verified").length;
 document.getElementById("completionBar").innerText=
 "Case Completion: "+Math.round((done/total)*100)+"% ("+done+"/"+total+")";

 let html="";

 tasks.forEach((t,i)=>{

 let pendingAt =
  t.status==="Submitted" ? t.verifier :
  t.status==="Verified" ? "Completed" :
  t.owner;

 let locked = pendingAt!==role;

 let icon = t.doc ? "📄" : "—";

 html+=`
 <tr class="${locked?'locked':''}">
  <td>${t.name}</td>
  <td><span class="badge ${t.status.toLowerCase()}">${t.status}</span></td>
  <td>${t.verifier}</td>
  <td>${pendingAt}</td>
  <td class="doc-icon">${icon}</td>
  <td>${locked?'<button class="gray">Locked</button>':actions(i)}</td>
 </tr>`;
 });

 document.getElementById("table").innerHTML=html;

 renderInsights(role);
 renderTimeline();
}

function actions(i){

 let t=tasks[i];

 if(t.owner==="Customer"){
   if(t.status==="Pending") return `<button class="blue" onclick="upload(${i})">Upload</button>`;
   if(t.status==="Query") return `<button class="blue" onclick="reupload(${i})">Re-upload</button>`;
 }

 if(t.owner==="Sales"){
   if(t.status==="Pending") return `<button class="blue" onclick="receive(${i})">Receive</button>`;
   if(t.status==="In Progress") return `<button class="greenBtn" onclick="submitTask(${i})">Submit</button>`;
 }

 if(t.owner==="Credit"){
   if(t.status==="Submitted") return `
     <button class="greenBtn" onclick="verify(${i})">Verify</button>
     <button class="orangeBtn" onclick="raiseQuery(${i})">Send Back</button>`;
 }

 return "";
}

/* ACTIONS */
function upload(i){ tasks[i].status="Submitted"; tasks[i].doc=true; log("Uploaded "+tasks[i].name); render(); }
function reupload(i){ tasks[i].status="Submitted"; log("Re-upload "+tasks[i].name); render(); }
function receive(i){ tasks[i].status="In Progress"; log("Sales received "+tasks[i].name); render(); }
function submitTask(i){ tasks[i].status="Submitted"; log("Submitted "+tasks[i].name); render(); }
function verify(i){ tasks[i].status="Verified"; log("Verified "+tasks[i].name); render(); }
function raiseQuery(i){ tasks[i].status="Query"; log("Query "+tasks[i].name); render(); }

function submit(){
 let role=roles[stage];
 let pending = tasks.filter(t => t.owner===role && !(t.status==="Submitted"||t.status==="Verified"));
 if(pending.length>0){ alert("Complete all tasks"); return; }
 if(stage<roles.length-1){ stage++; }
 render();
}

function renderInsights(role){
 let blocker = tasks.find(t=>t.status!=="Verified" && t.owner!==role);
 document.getElementById("blocker").className=blocker?"strip red":"strip green";
 document.getElementById("blocker").innerText=blocker?`BLOCKER: ${blocker.name}`:"No blockers";

 let next=tasks.find(t=>t.owner===role && t.status!=="Verified");
 document.getElementById("nextAction").className="strip orange";
 document.getElementById("nextAction").innerText=next?"Next Action: "+next.name:"";
}

function log(msg){
 timeline.unshift(new Date().toLocaleTimeString()+" | "+msg);
}

function renderTimeline(){
 let html="<b>Activity</b><br>";
 timeline.slice(0,5).forEach(t=> html+=`<div>${t}</div>`);
 document.getElementById("timeline").innerHTML=html;
}

render();

</script>

</body>
</html>
