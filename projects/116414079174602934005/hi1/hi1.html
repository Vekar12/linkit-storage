<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iLens Disbursement System</title>

<style>
body { margin:0; font-family:"Segoe UI"; background:#f4f6f9; }

/* ===== TOP ===== */
.topbar {
  background:#a3211f; color:#fff; padding:10px 20px;
  display:flex; justify-content:space-between;
}
.subbar {
  background:#c0392b; color:#fff; padding:8px 20px;
}

/* ===== LAYOUT ===== */
.container { display:flex; }

.sidebar {
  width:230px; background:#fff; border-right:1px solid #ddd;
}
.sidebar div {
  padding:12px; cursor:pointer;
}
.sidebar .active {
  background:#1f3a5f; color:#fff;
}

.main { flex:1; padding:15px; }

/* ===== HEADER ===== */
.header {
  background:#fff; padding:12px;
  display:flex; justify-content:space-between;
  border-radius:6px;
}

/* ===== PROGRESS ===== */
.progress-box {
  background:#fff; padding:15px; margin-top:10px;
  border-radius:6px;
}
.bar {
  height:14px; background:#ddd; border-radius:10px;
  overflow:hidden;
}
.fill { height:100%; background:#2e7d32; }

/* ===== CARDS ===== */
.cards { display:flex; gap:10px; margin-top:10px; }
.card {
  flex:1; background:#fff; padding:15px;
  border-radius:6px; text-align:center;
}
.small { font-size:12px; color:#777; }

/* ===== PANEL ===== */
.panel {
  background:#fff; margin-top:10px; border-radius:6px;
}
.panel-header {
  background:#1f3a5f; color:#fff; padding:10px;
}

/* ===== TABLE ===== */
table { width:100%; border-collapse:collapse; }
th,td {
  padding:10px; border-bottom:1px solid #eee;
}
th { background:#f0f3f7; }

/* ===== BADGE ===== */
.badge {
  padding:4px 8px; border-radius:5px; color:#fff;
  font-size:11px;
}
.pending { background:#e53935; }
.received { background:#2e7d32; }
.query { background:#f57c00; }
.verified { background:#2e7d32; }

/* ===== BUTTONS ===== */
button {
  padding:5px 8px; border:none; border-radius:4px;
  cursor:pointer; font-size:12px;
}
.blue { background:#1976d2; color:#fff; }
.green { background:#2e7d32; color:#fff; }
.orange { background:#f57c00; color:#fff; }

/* ===== TIMELINE ===== */
.timeline {
  background:#fff; margin-top:10px; padding:10px;
  border-radius:6px;
}
.timeline div { font-size:12px; margin-bottom:6px; }

</style>
</head>

<body>

<div class="topbar">
  <div>iLens Mortgage</div>
  <div>Maharshi Divekar</div>
</div>

<div class="subbar">Disbursement Module</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="active" onclick="show('summary')">Summary</div>
  <div onclick="show('dashboard')">Dashboard</div>
  <div onclick="show('sales')">Sales Workspace</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="header">
  <div><b>NARENDRA VERMA</b> | ₹17L</div>
  <div>Status: In Progress</div>
</div>

<!-- ===== SUMMARY ===== -->
<div id="summary">

<div class="progress-box">
  Case Readiness: <span id="percent"></span>%
  <div class="bar"><div class="fill" id="fill"></div></div>
</div>

<div class="cards" id="summaryCards"></div>

<div class="timeline" id="timeline"></div>

</div>

<!-- ===== DASHBOARD ===== -->
<div id="dashboard" style="display:none">

<div class="cards" id="roleCards"></div>

<div class="panel">
  <div class="panel-header" id="panelTitle"></div>
  <table>
    <thead>
      <tr>
        <th>Task</th><th>Status</th><th>Dependency</th><th>Action</th>
      </tr>
    </thead>
    <tbody id="taskTable"></tbody>
  </table>
</div>

</div>

<!-- ===== SALES ===== -->
<div id="sales" style="display:none">

<div class="panel">
  <div class="panel-header">Sales Workspace</div>

  <table>
    <thead>
      <tr>
        <th>Task</th><th>Mode</th><th>Status</th><th>Verification</th><th>Action</th>
      </tr>
    </thead>
    <tbody id="salesTable"></tbody>
  </table>

  <div style="padding:10px;text-align:right;">
    <button class="green">Submit Completed</button>
    <button class="orange">Hold Queries</button>
  </div>

</div>

</div>

</div>
</div>

<script>

/* ===== STATE ===== */
let tasks = [
 {name:"Agreement to Sale", role:"sales", mode:"Physical", status:"pending"},
 {name:"Property Tax", role:"sales", mode:"Digital", status:"received"},
 {name:"Builder NOC", role:"sales", mode:"Physical", status:"query"},
 {name:"Salary Slips", role:"credit", mode:"Digital", status:"verified"},
 {name:"PAN", role:"customer", mode:"Digital", status:"pending"}
];

let timeline = [];

/* ===== RENDER ===== */
function render(){
 renderSummary();
 renderDashboard();
 renderSales();
 updateProgress();
 renderTimeline();
}

/* ===== SUMMARY ===== */
function renderSummary(){
 let roles=["customer","sales","credit","rcu"];
 let html="";

 roles.forEach(r=>{
   let rTasks=tasks.filter(t=>t.role===r);
   let done=rTasks.filter(t=>t.status==="verified").length;

   html+=`<div class="card">
     ${r.toUpperCase()}
     <div>${done}/${rTasks.length}</div>
     <div class="small">${done===rTasks.length?"Done":"In Progress"}</div>
   </div>`;
 });

 document.getElementById("summaryCards").innerHTML=html;
}

/* ===== DASHBOARD ===== */
function renderDashboard(){
 let roles=["sales","customer","credit","rcu"];
 let html="";

 roles.forEach(r=>{
   let count=tasks.filter(t=>t.role===r && t.status!=="verified").length;
   html+=`<div class="card" onclick="openPanel('${r}')">
     ${r.toUpperCase()}
     <div>${count}</div>
   </div>`;
 });

 document.getElementById("roleCards").innerHTML=html;
}

/* ===== PANEL ===== */
let currentRole="sales";

function openPanel(r){
 currentRole=r;
 document.getElementById("panelTitle").innerText=r.toUpperCase()+" TASKS";
 renderTasks();
}

function renderTasks(){
 let html="";
 tasks.filter(t=>t.role===currentRole).forEach((t,i)=>{
   html+=`
   <tr>
     <td>${t.name}</td>
     <td><span class="badge ${t.status}">${t.status}</span></td>
     <td>Independent</td>
     <td>
       <button class="blue" onclick="update(${i},'received')">Receive</button>
       <button class="green" onclick="update(${i},'verified')">Verify</button>
       <button class="orange" onclick="update(${i},'query')">Query</button>
     </td>
   </tr>`;
 });
 document.getElementById("taskTable").innerHTML=html;
}

/* ===== SALES ===== */
function renderSales(){
 let html="";
 tasks.filter(t=>t.role==="sales").forEach((t,i)=>{
   html+=`
   <tr>
     <td>${t.name}</td>
     <td>${t.mode}</td>
     <td><span class="badge ${t.status}">${t.status}</span></td>
     <td>${t.status==="verified"?"Verified":"Pending"}</td>
     <td>
       <button class="blue" onclick="update(${i},'received')">Receive</button>
       <button class="green" onclick="update(${i},'verified')">Verify</button>
       <button class="orange" onclick="update(${i},'query')">Query</button>
     </td>
   </tr>`;
 });
 document.getElementById("salesTable").innerHTML=html;
}

/* ===== UPDATE ===== */
function update(i,status){
 tasks[i].status=status;

 timeline.unshift(`${new Date().toLocaleTimeString()} → ${tasks[i].name} marked ${status}`);

 render();
}

/* ===== PROGRESS ===== */
function updateProgress(){
 let done=tasks.filter(t=>t.status==="verified").length;
 let percent=Math.round((done/tasks.length)*100);

 document.getElementById("percent").innerText=percent;
 document.getElementById("fill").style.width=percent+"%";
}

/* ===== TIMELINE ===== */
function renderTimeline(){
 let html="<b>Recent Activity</b><br>";
 timeline.slice(0,5).forEach(t=> html+=`<div>${t}</div>`);
 document.getElementById("timeline").innerHTML=html;
}

/* ===== NAV ===== */
function show(s){
 document.getElementById("summary").style.display="none";
 document.getElementById("dashboard").style.display="none";
 document.getElementById("sales").style.display="none";

 document.getElementById(s).style.display="block";
}

render();

</script>

</body>
</html>
