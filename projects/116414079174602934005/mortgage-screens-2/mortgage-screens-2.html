<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iLens Disbursement OS</title>

<style>
body { margin:0; font-family:"Segoe UI"; background:#f4f6f9; }

/* ===== HEADER ===== */
.topbar { background:#a3211f; color:#fff; padding:10px 20px; display:flex; justify-content:space-between; }
.subbar { background:#c0392b; color:#fff; padding:8px 20px; }

/* ===== LAYOUT ===== */
.container { display:flex; }
.sidebar { width:220px; background:#fff; border-right:1px solid #ddd; }
.sidebar div { padding:12px; }
.main { flex:1; padding:15px; }

/* ===== HEADER ===== */
.header {
  background:#fff; padding:12px; border-radius:6px;
  display:flex; justify-content:space-between;
}

/* ===== TRACKER ===== */
.tracker {
  background:#fff; margin-top:10px; padding:10px;
  border-radius:6px;
}
.tracker-bar {
  display:flex; font-size:12px;
}
.stage {
  flex:1; text-align:center; padding:6px;
  border-right:1px solid #ddd;
}
.stage.active { background:#2e7d32; color:#fff; }

/* ===== STRIPS ===== */
.strip { margin-top:10px; padding:10px; border-radius:6px; font-size:13px; }
.red-bg { background:#fdecea; color:#c62828; }
.orange-bg { background:#fff3e0; color:#ef6c00; }
.green-bg { background:#e8f5e9; color:#2e7d32; }

/* ===== TABLE ===== */
.panel { margin-top:10px; background:#fff; border-radius:6px; }
.panel-header { background:#1f3a5f; color:#fff; padding:10px; }

table { width:100%; border-collapse:collapse; }
th, td { padding:10px; border-bottom:1px solid #eee; font-size:13px; }
th { background:#f0f3f7; }

/* ===== BADGES ===== */
.badge { padding:4px 8px; border-radius:5px; font-size:11px; color:#fff; }
.green { background:#2e7d32; }
yellow { background:#fbc02d; }
.red { background:#e53935; }
.orange { background:#f57c00; }

/* ===== BUTTONS ===== */
button { padding:5px 8px; border:none; border-radius:4px; cursor:pointer; font-size:12px; }
.blue { background:#1976d2; color:#fff; }
.greenBtn { background:#2e7d32; color:#fff; }
.orangeBtn { background:#f57c00; color:#fff; }
.gray { background:#ccc; cursor:not-allowed; }

/* ===== LOCK ===== */
.locked { opacity:0.4; pointer-events:none; }

/* ===== PRIORITY ===== */
.p1 { color:#c62828; font-weight:bold; }
.p2 { color:#f57c00; }
.p3 { color:#555; }

/* ===== TIMELINE ===== */
.timeline { background:#fff; padding:10px; margin-top:10px; border-radius:6px; font-size:12px; }

</style>
</head>

<body>

<div class="topbar">
  <div>iLens Mortgage</div>
  <div>Demo Mode</div>
</div>

<div class="subbar">Disbursement Workflow System</div>

<div class="container">

<div class="sidebar">
  <div>Documents Dashboard</div>
</div>

<div class="main">

<div class="header">
  <div><b>NARENDRA VERMA</b> | ₹17L</div>
  <div id="roleLabel"></div>
</div>

<!-- TRACKER -->
<div class="tracker">
  <div class="tracker-bar" id="tracker"></div>
</div>

<!-- INSIGHTS -->
<div id="critical" class="strip"></div>
<div id="nextAction" class="strip"></div>

<!-- TABLE -->
<div class="panel">
<div class="panel-header">Documents Dashboard</div>

<table>
<thead>
<tr>
<th>Document</th>
<th>Status</th>
<th>Verification</th>
<th>Owner</th>
<th>Dependency</th>
<th>SLA</th>
<th>Priority</th>
<th>Action</th>
</tr>
</thead>

<tbody id="table"></tbody>
</table>

<div style="padding:10px;text-align:right;">
  <button class="greenBtn" onclick="submit()">Submit</button>
</div>

</div>

<div class="timeline" id="timeline"></div>

</div>
</div>

<script>

/* ===== FLOW ===== */
let roles = ["Customer","Sales","Credit"];
let currentStage = 0;

/* ===== TRACKER STAGES ===== */
let stages = ["Login","Docs","Sales","Credit","Disbursement"];

/* ===== TASKS ===== */
let tasks = [
 {name:"PAN Upload", owner:"Customer", status:"pending", verify:"-", dep:"Independent", sla:2, priority:"P1"},
 {name:"Income Proof", owner:"Customer", status:"pending", verify:"-", dep:"Independent", sla:3, priority:"P2"},
 {name:"Agreement Collection", owner:"Sales", status:"pending", verify:"-", dep:"Hard", sla:2, priority:"P1"},
 {name:"Property Check", owner:"Sales", status:"pending", verify:"-", dep:"Soft", sla:4, priority:"P2"},
 {name:"Credit Verification", owner:"Credit", status:"pending", verify:"-", dep:"Hard", sla:3, priority:"P1"}
];

let timeline=[];

/* ===== RENDER ===== */
function render(){

 let role = roles[currentStage];
 document.getElementById("roleLabel").innerText = "Screen: " + role;

 renderTracker();
 renderTable(role);
 renderInsight(role);
 renderNextAction(role);
 renderTimeline();
}

/* ===== TRACKER ===== */
function renderTracker(){
 let html="";
 stages.forEach((s,i)=>{
   html+=`<div class="stage ${i<=currentStage?'active':''}">${s}</div>`;
 });
 document.getElementById("tracker").innerHTML=html;
}

/* ===== TABLE ===== */
function renderTable(role){

 let html="";

 tasks.forEach((t,i)=>{

 let locked = t.owner!==role;

 let depIcon = t.dep==="Hard"?"🔒":t.dep==="Soft"?"⚠":"";

 html+=`
 <tr class="${locked?'locked':''}">
  <td>${t.name}</td>
  <td><span class="badge ${t.status==='done'?'green':'orange'}">${t.status}</span></td>
  <td>${t.verify}</td>
  <td>${t.owner}</td>
  <td>${depIcon} ${t.dep}</td>
  <td>${t.sla}h</td>
  <td class="${t.priority.toLowerCase()}">${t.priority}</td>
  <td>
    ${locked ? `<button class="gray">Locked</button>` : getActions(i)}
  </td>
 </tr>`;
 });

 document.getElementById("table").innerHTML=html;
}

/* ===== ACTION ENGINE ===== */
function getActions(i){

 let t = tasks[i];

 if(t.owner==="Customer"){
   return `<button class="blue" onclick="upload(${i})">Upload</button>
           <button class="orangeBtn" onclick="query(${i})">Raise Query</button>`;
 }

 if(t.owner==="Sales"){
   return `<button class="blue" onclick="receive(${i})">Receive</button>
           <button class="greenBtn" onclick="submitToCredit(${i})">Submit</button>
           <button class="orangeBtn" onclick="query(${i})">Query</button>`;
 }

 if(t.owner==="Credit"){
   return `<button class="greenBtn" onclick="verify(${i})">Verify</button>
           <button class="orangeBtn" onclick="query(${i})">Raise Query</button>`;
 }

}

/* ===== ACTIONS ===== */
function upload(i){
 tasks[i].status="done";
 cascade();
 log("Customer uploaded " + tasks[i].name);
 render();
}

function receive(i){
 tasks[i].status="done";
 cascade();
 log("Sales received " + tasks[i].name);
 render();
}

function submitToCredit(i){
 tasks[i].status="done";
 log("Submitted to Credit");
 render();
}

function verify(i){
 tasks[i].verify="Verified";
 log("Credit verified " + tasks[i].name);
 render();
}

function query(i){
 tasks[i].status="query";
 log("Query raised for " + tasks[i].name);
 render();
}

/* ===== CASCADE ===== */
function cascade(){
 tasks.forEach(t=>{
   if(t.dep==="Hard") t.dep="Soft";
 });
}

/* ===== SUBMIT FLOW ===== */
function submit(){

 let role = roles[currentStage];

 let pending = tasks.filter(t => t.owner===role && t.status!=="done");

 if(pending.length>0){
   alert("Complete all tasks first");
   return;
 }

 if(currentStage < roles.length-1){
   currentStage++;
   alert("Moved to " + roles[currentStage]);
 } else {
   alert("Disbursement Completed ✅");
 }

 render();
}

/* ===== INSIGHT ===== */
function renderInsight(){

 let blocker = tasks.find(t => t.dep==="Hard" && t.status!=="done");

 if(blocker){
   document.getElementById("critical").className="strip red-bg";
   document.getElementById("critical").innerText =
   "BLOCKED: " + blocker.name + " pending with " + blocker.owner;
 } else {
   document.getElementById("critical").className="strip green-bg";
   document.getElementById("critical").innerText = "No blockers";
 }
}

/* ===== NEXT ACTION ===== */
function renderNextAction(role){

 let next = tasks.find(t => t.owner===role && t.status!=="done");

 if(next){
   document.getElementById("nextAction").className="strip orange-bg";
   document.getElementById("nextAction").innerText =
   "Next Action: " + role + " to complete " + next.name;
 }
}

/* ===== TIMELINE ===== */
function log(msg){
 timeline.unshift(new Date().toLocaleTimeString()+" | "+msg);
}

function renderTimeline(){
 let html="<b>Recent Activity</b><br>";
 timeline.slice(0,6).forEach(t=> html+=`<div>${t}</div>`);
 document.getElementById("timeline").innerHTML=html;
}

render();

</script>

</body>
</html>
