<style>
#overlayApp {
  position: fixed;
  top: 80px;
  right: 10px;
  width: 380px;
  max-height: 85vh;
  overflow-y: auto;
  background: #ffffff;
  z-index: 9999;
  border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  font-family: "Segoe UI";
}

#overlayHeader {
  background:#a3211f;
  color:#fff;
  padding:10px;
  font-weight:600;
  border-radius:10px 10px 0 0;
}

.section {
  padding:10px;
  border-bottom:1px solid #eee;
}

.role { background:#1f3a5f; color:#fff; padding:6px; border-radius:6px; margin-bottom:8px; }

.strip { padding:6px; border-radius:6px; font-size:12px; margin-bottom:6px; }
.green { background:#e8f5e9; color:#2e7d32; }
.red { background:#fdecea; color:#c62828; }
.orange { background:#fff3e0; color:#ef6c00; }

.stage-bar { display:flex; font-size:11px; }
.stage { flex:1; text-align:center; padding:4px; border-right:1px solid #ddd; }
.stage.active { background:#2e7d32; color:#fff; }

table { width:100%; font-size:11px; border-collapse:collapse; }
td { padding:5px; border-bottom:1px solid #eee; }

.badge { padding:2px 5px; border-radius:4px; font-size:10px; color:#fff; }
.pending { background:#fbc02d; color:#000; }
.submitted { background:#1976d2; }
.verified { background:#2e7d32; }
.query { background:#e53935; }

button {
  font-size:10px;
  padding:3px 5px;
  border:none;
  border-radius:4px;
  margin:1px;
}

.blue { background:#1976d2; color:#fff; }
.greenBtn { background:#2e7d32; color:#fff; }
.orangeBtn { background:#f57c00; color:#fff; }

#toggleBtn {
  position:fixed;
  top:80px;
  right:10px;
  z-index:10000;
  background:#a3211f;
  color:#fff;
  padding:8px;
  border:none;
  border-radius:6px;
}
</style>

<button id="toggleBtn">⚙️ Assist</button>

<div id="overlayApp" style="display:block;">
  <div id="overlayHeader">Smart Disbursement Assist</div>

  <div class="section">
    <div class="role" id="roleBanner"></div>
    <div class="strip green" id="progress"></div>

    <div class="stage-bar" id="tracker"></div>
  </div>

  <div class="section">
    <div id="blocker" class="strip"></div>
    <div id="nextAction" class="strip orange"></div>
  </div>

  <div class="section">
    <table id="table"></table>
    <button class="greenBtn" onclick="nextStage()">Move Next</button>
  </div>

  <div class="section" id="timeline"></div>
</div>

<script>
let roles=["Customer","Sales","Credit"];
let stage=0;

let tasks=[
 {name:"PAN", owner:"Customer", status:"Pending"},
 {name:"Aadhaar", owner:"Customer", status:"Pending"},
 {name:"Agreement", owner:"Sales", status:"Pending"},
 {name:"Property Docs", owner:"Sales", status:"Pending"},
 {name:"Credit Check", owner:"Credit", status:"Pending"}
];

let logData=[];

function render(){

 let role=roles[stage];
 document.getElementById("roleBanner").innerText="Role: "+role;

 let done=tasks.filter(t=>t.status==="Verified").length;
 document.getElementById("progress").innerText="Completion: "+Math.round(done/tasks.length*100)+"%";

 let t="";
 roles.forEach((r,i)=> t+=`<div class="stage ${i<=stage?'active':''}">${r}</div>`);
 document.getElementById("tracker").innerHTML=t;

 let html="";
 tasks.forEach((t,i)=>{
  html+=`
  <tr>
   <td>${t.name}</td>
   <td><span class="badge ${t.status.toLowerCase()}">${t.status}</span></td>
   <td>
     <button class="blue" onclick="start(${i})">Start</button>
     <button class="greenBtn" onclick="verify(${i})">Done</button>
     <button class="orangeBtn" onclick="query(${i})">Query</button>
   </td>
  </tr>`;
 });
 document.getElementById("table").innerHTML=html;

 let blocker = tasks.find(t=>t.status!=="Verified" && t.owner!==role);

 if(blocker){
  document.getElementById("blocker").className="strip red";
  document.getElementById("blocker").innerText="Blocker: "+blocker.name+" ("+blocker.owner+")";
 } else {
  document.getElementById("blocker").className="strip green";
  document.getElementById("blocker").innerText="No blockers";
 }

 let next=tasks.find(t=>t.owner===role && t.status!=="Verified");
 document.getElementById("nextAction").innerText=next?"Next: "+next.name:"";

 let timelineHTML="<b>Activity</b><br>";
 logData.slice(0,5).forEach(l=> timelineHTML+=`<div>${l}</div>`);
 document.getElementById("timeline").innerHTML=timelineHTML;
}

function start(i){ tasks[i].status="In Progress"; log("Started "+tasks[i].name); render(); }
function verify(i){ tasks[i].status="Verified"; log("Completed "+tasks[i].name); render(); }
function query(i){ tasks[i].status="Query"; log("Query raised "+tasks[i].name); render(); }

function nextStage(){
 if(stage<roles.length-1) stage++;
 render();
}

function log(msg){
 logData.unshift(new Date().toLocaleTimeString()+" | "+msg);
}

document.getElementById("toggleBtn").onclick=()=>{
 let app=document.getElementById("overlayApp");
 app.style.display = app.style.display==="none"?"block":"none";
};

render();
</script>
